[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cascadepahs"
version = "1.0.0"
description = "Robotic sensing–sampling and privileged-information learning (SOLACE) for high-frequency surrogate reconstruction of dissolved PAHs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Congchao Zhang"}, {name = "Peng Xiao"}, {name = "Longxin Guo"}, {name = "Aijie Wang"}, {name = "Yu Tao"}]
dependencies = [
  "numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "scikit-learn>=1.3", "matplotlib>=3.6", "pyyaml>=6.0", "joblib>=1.2",
]

[project.optional-dependencies]
full = ["xgboost>=1.7", "shap>=0.42"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
